# bundle patch for the points-checkin plugin: inserts its plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:<repo>/plugins/dsh-points-checkin`.
- insert:
    - id: points-checkin
      name: '@lament_z/dsh-points-checkin'
